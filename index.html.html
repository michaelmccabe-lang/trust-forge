<title>Trust Forge Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&family=Sora:wght@500;600&display=swap">
<style>
/* Layout: one-screen app. Dark CT canvas, three light stage panels (raw grey, AI pink dashed, final white) aligned row by row. Single committed dark look. */
:root{
  color-scheme: dark;
  --ct-dark:#150305; --ct-surface:#1F0A0D; --ct-line:#2A1316; --ct-line-2:#4A2A2E; --ct-muted:#D2B8BB;
  --red:#FC192E; --red-deep:#AB0010; --red-ink:#B0000D; --red-soft:#FF94A0;
  --raw:#F7F6F6; --ai:#FFF1F2; --fin:#FFFFFF; --ink:#150305; --ink-2:#4E3F41; --ink-3:#6E6466; --hair:#E1DCDC; --edge:#D3CFCF;
  --ok:#3E8E48; --ok-ink:#1F6B2A; --ok-bg:#DFF0E1; --warn:#D98700; --warn-ink:#8A5200; --warn-bg:#FFF4DE; --del-bg:#FDE1E4;
  --f-display:"Sora","Schibsted Grotesk",system-ui,sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Azeret Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
html,body{height:100%}
body{background:var(--ct-dark);color:#fff;font-family:var(--f-body);font-size:14px}
*{box-sizing:border-box}
button,input,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column}
.wrap{max-width:1440px;margin:0 auto;width:100%}

/* prototype bar */
.proto{flex:none;background:#0B0102;border-bottom:1px solid var(--ct-line);padding-block:6px}
.proto .wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.proto b{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--red-soft);text-transform:uppercase;margin-right:6px}
.pbtn{border:1px solid var(--ct-line-2);background:transparent;color:var(--ct-muted);border-radius:999px;padding:4px 11px;font-size:12px}
.pbtn.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}

/* app header */
.top{flex:none;border-bottom:1px solid var(--ct-line);padding-block:8px}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.logo{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.logo i{color:var(--red);font-style:normal}
.nav{display:flex;flex-wrap:wrap;flex:1 1 300px}
.nav span{padding:8px 12px;color:var(--ct-muted);font-size:13px}
.nav span.on{color:#fff;font-weight:600;box-shadow:inset 0 -2px 0 var(--red)}
.tabs{display:flex;border:1px solid var(--ct-line-2);border-radius:4px;overflow:hidden}
.tabs button{border:0;background:transparent;color:var(--ct-muted);padding:6px 12px;font-size:12px}
.tabs button+button{border-left:1px solid var(--ct-line-2)}
.tabs button.on{background:rgba(252,25,46,.18);color:#fff;font-weight:600}
.badge{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;border:1px solid var(--red);color:#fff;background:rgba(252,25,46,.18);border-radius:999px;padding:3px 10px;white-space:nowrap}

/* steps */
.steps{flex:none;padding-block:10px 0}
.steps .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--ct-line-2);background:transparent;color:var(--ct-muted);font-size:12px}
.stp.on{background:#fff;border-color:#fff;color:var(--ink);font-weight:600}
.stp .n{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;border:1px solid #6E5557}
.stp.on .n{background:var(--red);border-color:var(--red);color:#fff}
.stp.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stp-line{width:32px;height:1px;background:var(--ct-line-2)}
.steps .note{font-size:12px;color:var(--ct-muted)}

main{flex:1;min-height:0;overflow-y:auto}
.main-in{padding-block:12px 16px}
.bar{flex:none;border-top:1px solid var(--ct-line);padding-block:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.bar p{margin:0;font-size:12px;color:var(--ct-muted);flex:1 1 280px}
.paybox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;color:var(--ink);border-radius:8px;padding:8px 10px 8px 14px}

/* buttons */
.btn{border-radius:4px;font-weight:600;font-size:13px;min-height:40px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #C9C3C4;background:#fff;color:var(--ink);white-space:nowrap}
.btn.pri{background:linear-gradient(180deg,var(--red-deep),var(--red));border-color:var(--red-ink);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:var(--ct-line-2)}
.btn.ghost-red{background:transparent;color:var(--red-soft);border-color:var(--red-soft)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.acc,.den{font-weight:600;font-size:11px;border-radius:4px;padding:0 8px;min-height:26px;display:inline-flex;align-items:center;gap:4px}
.acc{border:1px solid var(--ok);background:var(--ok);color:#fff}
.den{border:1px solid var(--red-ink);background:#fff;color:var(--red-ink)}
.acc.off{background:#fff;color:var(--ok-ink)}
.den.on{background:var(--red-ink);color:#fff}

/* text bits */
.lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tx{font-size:12px;color:var(--ink-2);line-height:1.4;margin:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;border:1px solid #C9C3C4;color:#4E494A;background:#fff;white-space:nowrap}
.pill.on{border-color:#C8000F;color:#8A000B;background:#FDE6E8}
button.pill{min-height:28px}
button.pill.bad{border-color:var(--red-ink);color:#fff;background:var(--red-ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.g{background:var(--ok)}.dot.a{background:var(--warn)}.dot.r{background:#C8000F}
del{color:var(--red-ink);background:var(--del-bg);text-decoration:line-through;text-decoration-color:#C8000F;text-decoration-thickness:2px}
ins{color:var(--ok-ink);background:var(--ok-bg);text-decoration:underline;text-decoration-color:var(--ok);text-underline-offset:2px}
.field,.trk{background:#fff;border:1px solid #BDB6B7;border-radius:4px;padding:6px 9px;color:var(--ink);font-size:13.5px;line-height:1.4;width:100%;margin:0}
textarea.field{resize:vertical}
.warnr{margin:0;font-size:11.5px;color:#8A000B;background:var(--del-bg);border-radius:4px;padding:4px 7px;line-height:1.35}

/* three-stage grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1.1fr) 26px minmax(0,1fr);color:var(--ink)}
.c{padding:9px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.c1{background:var(--raw);border-left:1px solid var(--edge);border-right:1px solid var(--edge);border-bottom:1px solid var(--hair)}
.c2{background:var(--ai);border-left:1.5px dashed var(--red);border-right:1.5px dashed var(--red);border-bottom:1px solid #F4C7CC}
.c3{background:var(--fin);border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-bottom:1px solid #E7E3E3}
.c1.hd{border-top:1px solid var(--edge);border-radius:10px 10px 0 0}
.c2.hd{border-top:1.5px dashed var(--red);border-radius:10px 10px 0 0}
.c3.hd{border-top:2px solid var(--ink);border-radius:10px 10px 0 0}
.c1.ft{border-bottom:1px solid var(--edge);border-radius:0 0 10px 10px}
.c2.ft{border-bottom:1.5px dashed var(--red);border-radius:0 0 10px 10px}
.c3.ft{border-bottom:2px solid var(--ink);border-radius:0 0 10px 10px}
.hd{flex-direction:row;align-items:center;gap:10px;padding:10px 14px}
.ar{display:flex;align-items:center;justify-content:center;color:var(--red);font-family:var(--f-mono);font-size:13px}
.hi{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.ht{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0;line-height:1.1}
.hk{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block}
.hs{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-left:auto;color:#4E494A}
.rh{min-height:28px;display:flex;align-items:center;gap:7px}
.sn{font-family:var(--f-mono);font-size:10px;color:#C8000F;width:22px;flex:none}
.st{font-family:var(--f-display);font-size:13px;font-weight:500;margin:0}
.tag{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#4E494A}
.tag.w{color:var(--warn-ink)}.tag.g{color:var(--ok-ink)}
.ad{margin-left:auto;display:flex;gap:4px}
.fl{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.fv{font-size:13px;line-height:1.4;margin:0;color:var(--ink)}
.kept{font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;color:var(--warn-ink);background:var(--warn-bg);border-radius:3px;padding:2px 6px;align-self:flex-start}
.pend{opacity:.55}

/* time sum */
.eq{display:flex;align-items:stretch;gap:3px}
.tb{flex:1 1 0;min-width:0;border-radius:4px;padding:5px 7px;display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid #BDB6B7}
.tb.soft{background:#FAF8F8;border-color:var(--hair)}
.tb.res{border:1.5px solid var(--ink);background:#fff}
.tb.bad{border-color:var(--red-ink)}
.tbh{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.tbv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;white-space:nowrap}
.tbs{font-size:10.5px;color:var(--ink-3);line-height:1.3}
.op{flex:0 0 14px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:17px;font-weight:700;color:#C8000F}

/* step 1 */
.s1{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.panel{background:var(--raw);border:1px solid var(--edge);border-radius:10px;color:var(--ink);display:flex;flex-direction:column;min-width:0}
.panel.white{background:#fff}
.ph{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--edge)}
.row{padding:9px 16px;border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:5px}
.row:last-of-type{border-bottom:0}
.pfoot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--edge);background:#fff;border-radius:0 0 10px 10px}
.pfoot span{font-size:12px;color:var(--ink-2);flex:1 1 220px}
.thumb{position:relative;flex:0 0 92px;height:64px;border-radius:5px;border:1px solid #BDB6B7;overflow:hidden;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px),radial-gradient(80% 70% at 40% 40%,#7a2a30 0%,#2A1316 75%)}
.thumb.sm{flex-basis:70px;height:48px}
.thumb span.t{position:absolute;left:5px;bottom:3px;font-family:var(--f-mono);font-size:8px;color:#fff}
.thumb .bl{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(237,236,236,.88);filter:blur(1px)}

/* map */
.map{position:relative;overflow:hidden;background-color:#EFEAE4;background-image:linear-gradient(#E4DDD5 1px,transparent 1px),linear-gradient(90deg,#E4DDD5 1px,transparent 1px);background-size:40px 40px}
.map .road{position:absolute;box-sizing:border-box}
.map .lab{position:absolute;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.05em;white-space:nowrap}
.mk{position:absolute;transform:rotate(45deg)}
.num{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-mono);font-size:9px;display:flex;align-items:center;justify-content:center}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px}
.mapctl button{width:34px;height:34px;border-radius:4px;border:1px solid #BDB6B7;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:15px}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;padding:10px 14px;border-top:1px solid var(--hair)}
.lg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#2A1A1C}
.lgi{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex:none}

/* verifier */
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--ct-surface);border:1px solid var(--ct-line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;flex:1 1 130px}
.stat .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ct-muted)}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:22px;line-height:1;color:#fff}
.stat .s{font-family:var(--f-mono);font-size:10px;color:var(--ct-muted);display:flex;gap:8px;align-items:center}
.lvls{display:flex;gap:6px;align-items:flex-end;height:46px}
.lvls div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:9.5px;color:#fff}
.lvls i{display:block;width:100%;border-radius:2px 2px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--ct-line-2);background:transparent;color:var(--ct-muted);border-radius:999px;padding:4px 10px;font-family:var(--f-mono);font-size:10px}
.chip.on{border-color:var(--red);color:#fff;background:rgba(252,25,46,.18)}
.queue{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.q{flex:0 0 200px;text-align:left;display:flex;flex-direction:column;gap:4px;padding:8px 11px;border-radius:8px;background:#fff;border:1px solid var(--edge);color:var(--ink)}
.q.on{border:2px solid var(--red);background:#FDE6E8}
.q .t{font-size:12px;line-height:1.3}
.q .m{font-family:var(--f-mono);font-size:9px;color:var(--ink-3);display:flex;gap:5px;align-items:center}
.vcols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.card{background:#fff;border:1px solid var(--edge);border-radius:10px;color:var(--ink);min-width:0}
.card .ph{border-bottom-color:var(--hair);padding:9px 14px}
.fr{display:grid;grid-template-columns:96px minmax(0,1fr) 140px;gap:12px;padding:9px 14px;border-bottom:1px solid #E7E3E3;align-items:start}
.dif{font-size:11.5px;line-height:1.4;color:var(--ink-2);margin:4px 0 0;padding:4px 7px;background:#FAF8F8;border-radius:4px}
.prov{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap;justify-self:start}
.prov.r{background:#F1EFEF;color:#4E494A}.prov.a{background:var(--ok-bg);color:var(--ok-ink)}.prov.d{background:var(--warn-bg);color:var(--warn-ink)}
.ck{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.35;padding:2px 0}
.ck .y{color:#2F7A38;font-weight:700}.ck .w{color:#B06A00;font-weight:700}
.sim{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:9px 14px;border-top:1px solid #E7E3E3;align-items:start}
.sim.hot{background:var(--warn-bg)}
.simn{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-mono);font-size:10px;display:flex;align-items:center;justify-content:center}
.sb{font-weight:600;font-size:11.5px;border-radius:4px;min-height:30px;padding:0 9px;border:1px solid #C9C3C4;background:#fff;color:var(--ink);white-space:nowrap}
.sb.same{background:var(--warn);border-color:var(--warn);color:#fff}
.sb.diff{background:var(--ink);border-color:var(--ink);color:#fff}
.status{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;border-radius:999px;padding:3px 9px;white-space:nowrap;border:1px solid}
.status.u{border-color:var(--warn);color:var(--warn-ink);background:var(--warn-bg)}
.status.v{border-color:var(--ok);color:#fff;background:var(--ok)}
.status.x{border-color:var(--red-ink);color:#fff;background:var(--red-ink)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(21,3,5,.65);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:#fff;color:var(--ink);border-radius:12px;width:min(920px,100%);max-height:100%;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--ink);border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:0 0 0 1px var(--ink),0 10px 30px rgba(0,0,0,.5);z-index:60;max-width:calc(100% - 32px)}
.checking{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 16px;color:#fff;text-align:center}
.scan{width:240px;height:4px;border-radius:2px;background:var(--ct-line);overflow:hidden;position:relative}
.scan i{position:absolute;inset:0;width:40%;background:var(--red);animation:scan 1.1s cubic-bezier(.4,0,.2,1) infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.scan i{animation:none;width:100%}}

@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .ar{display:none}
  .c{border-radius:0}
  .c1{border-top:1px solid var(--edge);border-radius:10px 10px 0 0}
  .c3{border-bottom:2px solid var(--ink);border-radius:0 0 10px 10px;margin-bottom:12px}
  .fr{grid-template-columns:minmax(0,1fr)}
  .legend{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>

<div class="app" id="app"></div>

<script>
(function(){
const SUBMIT_SRC = 14*60+52, POST = 14*60+47, SUBMIT_PRI = 14*60+24, SEEN = 14*60+18;
const RATES = [[15,1.00,'0-15 MIN'],[30,0.75,'16-30 MIN'],[60,0.60,'31-60 MIN'],[120,0.25,'61-120 MIN'],[1440,0.10,'2-24 HR'],[2880,0.05,'24-48 HR']];
const TRUST = 1.4, PRIMARY_BONUS = 1.5;

const fresh = () => ({
  flow:'source', screen:'s1', checking:false, toast:'', submittedFlow:'source',
  src:{offset:'none', acc:{title:null, summary:null, time:null}},
  pri:{offset:'yes', acc:{title:null, summary:null, location:null, time:null, privacy:null}},
  ver:{queue:0, filter:'green', similar:{1:null,2:null,3:null}, privacy:false, blurred:false, status:'u', rejecting:false, reason:null, mapBig:false}
});
let S = fresh();
let toastTimer = null;

const hm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const band = mins => RATES.find(r => mins <= r[0]) || RATES[RATES.length-1];
const money = v => '£'+v.toFixed(2);

/* icons */

/* derived values */
function srcCalc(){
  const o = SRC_OFFSETS[S.src.offset];
  const rawInc = POST - o.min;
  const aiInc = POST - SRC.aiOffset;
  const t = S.src.acc.time;
  const finalOffset = t===false ? o.min : SRC.aiOffset;
  const finalInc = POST - finalOffset;
  const b = band(SUBMIT_SRC - finalInc);
  return {o, rawInc, aiInc, finalOffset, finalInc, band:b, pay:b[1]*TRUST, mins:SUBMIT_SRC-finalInc, timeChange: o.min!==SRC.aiOffset};
}
function priCalc(){
  const o = PRI_OFFSETS[S.pri.offset];
  const rawInc = SEEN - o.min;
  const t = S.pri.acc.time;
  const finalOffset = t===false ? o.min : PRI.aiOffset;
  const finalInc = SEEN - finalOffset;
  const b = band(SUBMIT_PRI - finalInc);
  return {o, rawInc, finalOffset, finalInc, band:b, pay:b[1]*TRUST*PRIMARY_BONUS, mins:SUBMIT_PRI-finalInc, timeChange: o.min!==PRI.aiOffset};
}
function pending(flow){
  const a = flow==='source' ? S.src.acc : S.pri.acc;
  const c = flow==='source' ? srcCalc() : priCalc();
  return Object.entries(a).filter(([k,v]) => v===null && !(k==='time' && !c.timeChange)).length;
}
function decided(flow,key){ return (flow==='source'?S.src.acc:S.pri.acc)[key]; }

    <div class="lg"><span class="lgi"><span style="width:16px;height:16px;border-radius:50%;border:1.5px dashed #8C8284"></span></span>2 km search</div></div>`;
  const evid = d.flow==='primary' ? `<div style="display:flex;gap:6px;margin-top:6px"><div class="thumb sm">${(S.pri.acc.privacy!==false)?'<span class="bl" style="left:18px;top:10px"></span>':''}<span class="t">IMG_2204</span></div><div class="thumb sm">${(S.pri.acc.privacy!==false)?'<span class="bl" style="left:24px;top:12px"></span>':''}<span class="t">VID_2205</span></div></div>` : '';
  const done = v.status!=='u';
  return `<div style="display:flex;flex-direction:column;gap:10px">
    <div class="stats">
      <div class="stat"><span class="k">Left to verify</span><span class="v">${left}</span><span class="s"><span><span class="dot g"></span> ${v.status==='u'?21:20}</span><span><span class="dot a"></span> 12</span><span><span class="dot r"></span> 5</span></span></div>
      <div class="stat"><span class="k">Oldest waiting</span><span class="v">14<span style="font-size:12px;color:var(--ct-muted)"> min</span></span><span class="s">AVG 6 MIN</span></div>
      <div class="stat"><span class="k">Verified today</span><span class="v">${v.status==='v'?413:412}</span><span class="s">${v.status==='x'?27:26} REJECTED</span></div>
      <div class="stat"><span class="k">Possible duplicates</span><span class="v" style="color:#F7C25A">4</span><span class="s">SAME PLACE AND TIME</span></div>
      <div class="stat" style="flex:2 1 280px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="k">Active reporters by level · last hour</span><span class="mono" style="font-size:11px">47</span></div>
        <div class="lvls" role="img" aria-label="Active reporters: level 1 18, level 2 11, level 3 8, level 4 6, level 5 3, level 6 1">
          <div>18<i style="height:28px;background:#6E5557"></i></div><div>11<i style="height:17px;background:#8C5A5F"></i></div><div>8<i style="height:13px;background:#AB0010"></i></div><div>6<i style="height:10px;background:#D4101F"></i></div><div>3<i style="height:6px;background:var(--red)"></i></div><div>1<i style="height:3px;background:var(--red-soft)"></i></div></div>
        <div style="display:flex;gap:6px">${['L1','L2','L3','L4','L5','L6'].map(l=>`<span class="mono" style="flex:1;text-align:center;font-size:9px;color:var(--ct-muted)">${l}</span>`).join('')}</div></div>
    </div>
    <div class="chips"><span class="mono" style="font-size:9.5px;letter-spacing:.12em;color:var(--ct-muted);margin-right:4px">QUEUE</span>
      ${[['green','All-green first'],['region','My region'],['new','New reporters'],['dup','Possible duplicates · 4'],['old','Oldest first']].map(([k,l])=>`<button class="chip ${v.filter===k?'on':''}" data-act="filter" data-to="${k}" aria-pressed="${v.filter===k}">${l}</button>`).join('')}</div>
    <div class="queue">${queue.map((q,i)=>`<button class="q ${i===0?'on':''}" data-act="queue" data-i="${i}"><span class="t">${q[0]}</span><span class="m"><span class="dot ${q[1]}"></span>${i===0&&done?(v.status==='v'?'VERIFIED':'REJECTED'):q[2]}</span>${q[3]?`<span class="m" style="color:var(--warn-ink)">${q[3]}</span>`:''}</button>`).join('')}</div>

    <div class="vcols">
      <div style="flex:1.25 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px">
        <section class="card" aria-label="Report under check">
          <div class="ph" style="flex-wrap:wrap"><span class="hi" style="background:var(--ink);color:#fff">${I.doc}</span>
            <div><span class="lbl" style="display:block">${d.flow==='primary'?'Primary report':'Submitted report'} · ${d.id} · ${d.sub} EAT</span><h2 class="ht" style="font-size:15px">${d.title}</h2></div>
            <span style="margin-left:auto">${statusPill}</span></div>
          <div class="fr" style="background:#FAF8F8;padding:6px 14px"><span class="lbl">Field</span><span class="lbl">Submitted value · what changed</span><span class="lbl">Who set it</span></div>
          <div class="fr"><span class="lbl" style="padding-top:3px">01 Title</span><div><p class="fv" style="font-family:var(--f-display);font-weight:500">${d.title}</p><p class="dif">${d.titleP[0]==='d'?'AI suggested: '+d.titleDif:d.titleDif}</p></div><span class="prov ${d.titleP[0]}">${d.titleP[1]}</span></div>
          <div class="fr"><span class="lbl" style="padding-top:3px">02 Category</span><p class="fv">Social &amp; Political › Road Blockade</p><span class="prov r">Reporter · AI agreed</span></div>
          <div class="fr"><span class="lbl" style="padding-top:3px">03 Summary</span><div><p class="fv" style="font-size:12.5px">${d.summary}</p><p class="dif">${d.summaryP[0]==='d'?'AI suggested additions were denied by the reporter.':d.summaryDif}</p></div><span class="prov ${d.summaryP[0]}">${d.summaryP[1]}</span></div>
          <div class="fr"><span class="lbl" style="padding-top:3px">04 Location</span><div><p class="fv">${d.location}</p><p class="fv mono" style="font-size:10.5px;color:#4E494A">⌖ STREET / JUNCTION · ±150 M</p></div><span class="prov ${d.locationP[0]}">${d.locationP[1]}</span></div>
          <div class="fr"><span class="lbl" style="padding-top:3px">05 Incident time</span><div>
            ${sum(box('soft',d.flow==='primary'?I.eye:I.msg,'05a '+(d.flow==='primary'?'seen':'in source'),d.a05,d.a05s),box('soft',I.glass,'05b offset',d.b05,d.flow==='primary'?'arrived after':'repost, min 20'),box('res',I.cross,'05c incident',d.c05,'Nairobi, Kenya, Africa'))}
            <p class="dif">${d.timeNote} UTC+3.</p></div><span class="prov ${d.timeP[0]}">${d.timeP[1]}</span></div>
          <div class="fr" style="border-bottom:0;background:#FFF8EC;box-shadow:inset 3px 0 0 var(--warn);border-radius:0 0 10px 10px"><span class="lbl" style="padding-top:3px;color:var(--warn-ink)">06 Privacy<br><span style="font-size:8.5px;color:var(--ink-3);letter-spacing:.06em">GDPR · NOT REPORTED</span></span>
            <div style="display:flex;flex-direction:column;gap:4px">
              <div class="ck"><span class="y">✓</span><span>Report text: no names, numbers, addresses or plates of private individuals.</span></div>
              <div class="ck"><span class="${v.blurred||d.privacy[0]==='y'?'y':'w'}">${v.blurred||d.privacy[0]==='y'?'✓':'◆'}</span><span>${v.blurred?'Faces and plate blurred by the verifier.':d.privacy[1]}</span></div>
              <div class="ck"><span class="y">✓</span><span>Police and public figures only named in their official role.</span></div>
              ${evid}
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start">${d.privFlag && !v.blurred ? '<span class="prov d">◆ AI flag · 1 issue</span><button class="sb" style="border-color:var(--warn);color:var(--warn-ink)" data-act="blur">Blur Media</button>' : '<span class="prov a">✓ Clear</span>'}</div></div>
        </section>
        <div style="display:flex;flex-wrap:wrap;gap:12px">
          <section class="card" style="flex:1 1 240px"><div class="ph"><h2 class="ht" style="font-size:14px">source</h2></div><div style="padding:8px 14px 10px;display:flex;flex-direction:column;gap:6px">${d.source.map((s,i)=>`<div class="mono" style="font-size:10px;color:${i===2?'#2F7A38':'#4E494A'}">${s}</div>`).join('')}</div></section>
          <section class="card" style="flex:1 1 240px"><div class="ph"><h2 class="ht" style="font-size:14px">checks</h2></div><div style="padding:6px 14px 8px">
            <div class="ck"><span class="${d.denied?'w':'y'}">${d.denied?'◆':'✓'}</span><span>${d.denied?d.denied+' AI fix'+(d.denied>1?'es':'')+' denied by the reporter.':'AI fixes accepted. None denied.'}</span></div>
            <div class="ck"><span class="y">✓</span><span>Own words. Category matches.</span></div>
            <div class="ck"><span class="w">◆</span><span>3 similar threats within 2 km and ±2 h.</span></div></div></section>
          <section class="card" style="flex:1 1 240px"><div class="ph"><h2 class="ht" style="font-size:14px">reporter ${d.reporter}</h2><span class="mono" style="margin-left:auto;font-size:10px;color:var(--ink-3)">L4 · ×1.4</span></div><div class="mono" style="padding:8px 14px 10px;font-size:10px;color:#4E494A;line-height:1.6">91% VERIFIED · 1,204 REPORTS<br><span style="color:var(--warn-ink)">TIME FIXED IN 3 OF LAST 10</span></div></section>
        </div>
      </div>
      <div style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px">
        <section class="card" style="overflow:hidden" aria-label="Map of this report and similar threats">
          <div class="ph"><span class="hi" style="background:var(--ink);color:#fff">${I.pin}</span><h2 class="ht" style="font-size:14px">location and similar threats</h2><span class="mono" style="margin-left:auto;font-size:10px;color:var(--ink-3)">2 KM · ±2 H</span></div>
          <div style="position:relative">${mapBase('340px',mapExtra(false))}<div class="mapctl" style="top:auto;bottom:10px"><button aria-label="Expand map" data-act="mapbig">${I.expand}</button></div></div>
          ${legend}
        </section>
        <section class="card" aria-label="Similar threats">
          <div class="ph"><h2 class="ht" style="font-size:14px">similar threats</h2><span class="mono" style="margin-left:auto;font-size:10px;color:var(--ink-3)">WITHIN 2 KM · ±2 H · DIFFERENT SOURCES</span></div>
          ${simRows}
          <p class="tx" style="padding:8px 14px 10px;border-top:1px solid #E7E3E3">The same source link can't be submitted twice, so matches are found by place and time. Only the first verified report of an incident is paid.</p>
        </section>
      </div>
    </div>
  </div>
  ${v.mapBig ? `<div class="scrim" data-act="mapclose"><div class="dialog" role="dialog" aria-label="Expanded map" data-stop="1"><div class="ph" style="border-bottom:1px solid var(--hair)"><h2 class="ht">location and similar threats</h2><button class="btn" style="margin-left:auto;min-height:34px" data-act="mapclose">Close</button></div>${mapBase('min(70vh,560px)',mapExtra(true))}${legend}</div></div>`:''}
  ${v.rejecting ? `<div class="scrim" data-act="rejclose"><div class="dialog" role="dialog" aria-label="Reject with reason" data-stop="1" style="width:min(520px,100%)"><div class="ph" style="border-bottom:1px solid var(--hair)"><h2 class="ht">reject with reason</h2></div><div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px">
      ${['Duplicate of an earlier report','Time not supported by the source','Location wrong or too vague','Summary missing key details from the source','Source not credible or not accessible','Personal data that can\'t be removed'].map((r,i)=>`<label style="display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 0"><input type="radio" name="rej" id="rej-${i}" ${v.reason===i?'checked':''} data-act="reason" data-i="${i}">${r}</label>`).join('')}
      <p class="tx">The reporter sees this reason on their dashboard.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="rejclose">Cancel</button><button class="btn" style="background:var(--red-ink);border-color:var(--red-ink);color:#fff" data-act="rejconfirm" ${v.reason===null?'disabled':''}>Reject Report</button></div></div></div></div>`:''}`;
}
function verBar(){
  const d = verData(), v = S.ver;
  const done = v.status!=='u';
  const needBlur = d.privFlag && !v.blurred;
  return `<footer class="bar gut"><div class="wrap">
    <span class="mono" style="font-size:11px;color:var(--ct-muted);flex:1 1 260px">${done ? (v.status==='v' ? `VERIFIED · <span style="color:#fff;font-size:15px">${money(d.pay)}</span> ADDED TO REPORTER WALLET` : 'REJECTED · REPORTER NOTIFIED WITH REASON') : `PAY ON VERIFY: ${d.payLine} = <span style="color:#fff;font-size:15px">${money(d.pay)}</span> · FIRST REPORT`}</span>
    ${done ? `<button class="btn ghost" data-act="undo">Undo</button><button class="btn pri" data-act="toast" data-msg="Next report: Lorry drivers' strike closes Tema port gate, Ghana (example only).">Next Report</button>` :
    `<button class="btn ghost" data-act="toast" data-msg="Edit opens each field for correction in the live build.">Edit</button>
    <button class="btn ghost-red" data-act="reject">✕ Reject With Reason</button>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#fff;padding:0 10px;min-height:40px;border:1px solid ${v.privacy?'var(--ok)':'var(--warn)'};border-radius:4px;cursor:pointer"><input type="checkbox" id="privacy-ok" ${v.privacy?'checked':''} data-act="privacy" style="width:18px;height:18px;accent-color:var(--ok)">Privacy reviewed${needBlur?' <span class="mono" style="font-size:9.5px;color:#F7C25A">· MEDIA NOT BLURRED</span>':''}</label>
    <button class="btn ok" style="min-width:140px" data-act="verify" ${v.privacy?'':'disabled'}>✓ Verify</button>`}
  </div></footer>`;
}

/* ---------- render ---------- */
function render(){
  const app = document.getElementById('app');
  const scrollEl = app.querySelector('main');
  const keep = scrollEl ? scrollEl.scrollTop : 0;
  let body, bar = '';
  if (S.checking){
    body = `<div class="checking"><div style="font-family:var(--f-display);font-size:22px">checking your report.</div><div class="scan"><i></i></div>
      <div class="mono" style="font-size:11px;color:var(--ct-muted);line-height:1.8">${S.flow==='source'?'READING SOURCE · MATCHING TITLE AND SUMMARY · CHECKING TIME AND OFFSET · CHECKING PRIVACY':'READING EXIF · MATCHING GPS · REVERSE IMAGE SEARCH · CHECKING TIME · FINDING FACES AND PLATES'}</div></div>`;
  } else if (S.screen==='s1') body = step1();
  else if (S.screen==='s2'){ body = step2(); bar = step2bar(); }
  else { body = verifier(); bar = verBar(); }
  app.innerHTML = protoBar() + header() + steps() + `<main><div class="main-in gut"><div class="wrap">${body}</div></div></main>` + bar + (S.toast ? `<div class="toast" role="status">${S.toast}</div>` : '');
  const m = app.querySelector('main'); if (m && !S.reset) m.scrollTop = keep; S.reset = false;
}
function toast(msg){ S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ S.toast=''; render(); }, 2600); }
function go(screen){ S.screen = screen; S.reset = true; render(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if ((act==='mapclose' || act==='rejclose') && t.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  switch(act){
    case 'jump':
      if (t.dataset.to==='ver'){ S.screen='ver'; }
      else { S.flow=t.dataset.to; S.screen='s1'; }
      S.reset=true; render(); break;
    case 'reset': S = fresh(); S.reset=true; render(); break;
    case 'flow': S.flow=t.dataset.to; go('s1'); break;
    case 'go': go(t.dataset.to); break;
    case 'aicheck':
      if (S.screen==='s2') return;
      S.checking=true; render();
      setTimeout(()=>{ S.checking=false; go('s2'); }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 1400); break;
    case 'offset':
      if (S.flow==='source') S.src.offset=t.dataset.to; else S.pri.offset=t.dataset.to;
      render(); break;
    case 'acc': case 'den': {
      const acc = (t.dataset.flow==='source'?S.src:S.pri).acc;
      acc[t.dataset.key] = act==='acc'; render(); break; }
    case 'all': {
      const acc = (t.dataset.flow==='source'?S.src:S.pri).acc;
      Object.keys(acc).forEach(k => acc[k] = t.dataset.v==='1'); render(); break; }
    case 'submit':
      if (S.screen==='s1'){ toast('Run the AI check first.'); return; }
      if (pending(S.flow)){ toast('Accept or deny every suggestion before submitting.'); return; }
      S.submittedFlow = S.flow; S.ver = fresh().ver; S.screen='ver'; S.reset=true;
      toast('Submitted. Your report is live as Unverified.'); break;
    case 'toast': toast(t.dataset.msg); break;
    case 'filter': S.ver.filter=t.dataset.to; render(); break;
    case 'queue': if (t.dataset.i!=='0') toast('Example only: this prototype opens one report.'); break;
    case 'sim': { const n=t.dataset.n, v=t.dataset.v; S.ver.similar[n] = S.ver.similar[n]===v ? null : v; render(); break; }
    case 'blur': S.ver.blurred=true; toast('Faces and plate blurred.'); break;
    case 'privacy': S.ver.privacy = !S.ver.privacy; render(); break;
    case 'verify': if (!S.ver.privacy) return; S.ver.status='v'; toast('Verified. '+money(verData().pay)+' added to the reporter\'s wallet.'); break;
    case 'reject': S.ver.rejecting=true; S.ver.reason=null; render(); break;
    case 'reason': S.ver.reason=+t.dataset.i; render(); break;
    case 'rejclose': S.ver.rejecting=false; render(); break;
    case 'rejconfirm': S.ver.rejecting=false; S.ver.status='x'; toast('Rejected. The reporter can see the reason.'); break;
    case 'undo': S.ver.status='u'; render(); break;
    case 'mapbig': S.ver.mapBig=true; render(); break;
    case 'mapclose': S.ver.mapBig=false; render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && (S.ver.mapBig || S.ver.rejecting)){ S.ver.mapBig=false; S.ver.rejecting=false; render(); }
});
render();
})();
</script>
